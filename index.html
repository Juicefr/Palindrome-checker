<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="container">
  <h1>Juice.sol's Palindrome Checker</h1>
  <p class="subtitle">
    Discover whether your words read the same backwards.
  </p>

  <div class="checker">
    <label for="text-input">Enter a word or phrase</label>

    <input
      type="text"
      id="text-input"
      placeholder="e.g. race car, eye"
    />

    <button id="check-btn">Check Palindrome</button>

    <div id="result" aria-live="polite"></div>
  </div>

  <p class="hint">
    Tip: spaces, punctuation, and capitalization don't count!
  </p>
</main>
<script src = "script.js"></script>
</body>

</html>
